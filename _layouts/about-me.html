---
layout: base
---

<header class="bg-about about-title">
 <div class="container-about">
    <div class="left-about">
       <div class="box-image">
       <img class="image-me" src="{{ page.header.imagen }}" loading="lazy" />
       </div>
    </div>
    <div class="right-about">
        <div class="first">
            <i>{{ page.header.title }}</i>
        </div>
        <div class="second">
            {{ page.header.text }}
        </div>
        <div class="third">
            {{ page.header.h3 }}
        </div>
        <div class="four">
            <a href="#">{{ page.header.h4 }} <i class="bi bi-arrow-right-circle-fill"></i></a>
        </div>
    </div>
 </div>
</header>
